<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LLM Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        #header { padding: 12px 20px; background: #2a2a2a; border-bottom: 1px solid #333; display: flex; gap: 12px; align-items: center; }
        #header select, #header input { background: #333; color: #eee; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; }
        #header select { flex: 1; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
        .user { background: #2563eb; align-self: flex-end; }
        .assistant { background: #2a2a2a; align-self: flex-start; }
        #footer { padding: 12px 20px; background: #2a2a2a; border-top: 1px solid #333; display: flex; gap: 10px; }
        #input { flex: 1; background: #333; color: #eee; border: 1px solid #444; padding: 10px 14px; border-radius: 8px; font-size: 15px; resize: none; height: 44px; }
        #send { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; }
        #send:disabled { background: #444; cursor: not-allowed; }
        #stream-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>

<div id="header">
    <select id="model-select"><option>Загрузка моделей...</option></select>
    <label id="stream-toggle">
        <input type="checkbox" id="stream" checked> stream
    </label>
</div>

<div id="chat"></div>

<div id="footer">
    <textarea id="input" placeholder="Напиши сообщение..."></textarea>
    <button id="send">Отправить</button>
</div>

<script>
    const API = "http://localhost:8000";
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const modelSelect = document.getElementById("model-select");
    const streamToggle = document.getElementById("stream");
    const history = [];

    async function loadModels() {
        const res = await fetch(`${API}/v1/models`);
        const data = await res.json();
        modelSelect.innerHTML = data.models.map(m => `<option value="${m}">${m}</option>`).join("");
    }

    function addMessage(role, content) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        div.textContent = content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        send.disabled = true;
        history.push({ role: "user", content: text });
        addMessage("user", text);

        const assistantDiv = addMessage("assistant", "...");
        const useStream = streamToggle.checked;

        const body = {
            model: modelSelect.value,
            messages: history,
            stream: useStream,
        };

        if (useStream) {
            const res = await fetch(`${API}/v1/chat/completions`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let full = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const lines = decoder.decode(value).split("\n");
                for (const line of lines) {
                    if (line.startsWith("data: ") && line !== "data: [DONE]") {
                        const chunk = JSON.parse(line.slice(6));
                        const delta = chunk.choices[0].delta.content || "";
                        full += delta;
                        assistantDiv.textContent = full;
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            }
            history.push({ role: "assistant", content: full });

        } else {
            const res = await fetch(`${API}/v1/chat/completions`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            const data = await res.json();
            const content = data.choices[0].message.content;
            assistantDiv.textContent = content;
            history.push({ role: "assistant", content });
        }

        send.disabled = false;
        input.focus();
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    loadModels();
</script>
</body>
</html>
